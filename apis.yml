aid: audible
name: Audible
description: 'Audible is an Amazon-owned online audiobook, podcast, and spoken-word entertainment service.
  It sells and streams audiobooks, Audible Originals, and podcasts through membership plans and a la carte
  purchases, delivered via web, iOS, Android, Alexa, and Kindle apps. Audible does not operate a public
  developer program or documented API — its catalog, library, and playback endpoints are a private
  internal API consumed by its own first-party apps. Community projects (the mkb79/Audible Python library,
  audible-cli, and omarroth/audible.cr) reverse-engineer that internal API; none are first-party or
  officially supported. This profile catalogs Audible''s public web, help, and legal surface plus the
  unofficial client ecosystem.'
